# API Gateway Configuration
gateway:
  port: 8080
  slow_ms: 1000
  timeout_ms: 5000
  log_level: "info"
  log_format: "json"

# Downstream Services
downstream:
  hrms_core_base_url: "http://localhost:8081"

# Telemetry
telemetry:
  newrelic:
    license_key: ""  # Set via NEWRELIC_LICENSE_KEY env var
    app_name: "api-gateway"
    enabled: true
  slack:
    webhook_url: ""  # Set via SLACK_WEBHOOK_URL env var
    enabled: true
    channel: ""

# Retry Configuration
retry:
  max_attempts: 3
  initial_delay_ms: 100
  max_delay_ms: 5000

# JWT Configuration
jwt:
  secret_key: ""  # Set via JWT_SECRET_KEY env var (REQUIRED, min 32 chars)
  access_token_expiry_minutes: 15
  refresh_token_expiry_hours: 168  # 7 days

